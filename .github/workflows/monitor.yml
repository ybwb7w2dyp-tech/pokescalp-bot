name: PokéScalp restock monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:         # bouton « Run workflow » pour tester à la main

permissions:
  contents: write            # pour sauvegarder state.json

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Vérifier les stocks
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
      - name: Sauvegarder l'état
        run: |
          git config user.name "pokescalp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state update"
            git push
          fi
